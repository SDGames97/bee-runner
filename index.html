<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>WormRing 3D</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Firebase SDKs via CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #game-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.05);
      border-radius: 10px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 10px;
    }
  </style>
</head>
<body class="bg-slate-900 text-white">

  <!-- 3D Spiel Canvas -->
  <canvas id="game-canvas"></canvas>

  <!-- Einstellungen-Button (Oben Rechts) -->
  <button id="settings-btn" class="absolute top-4 right-4 z-40 bg-white/20 hover:bg-white/30 backdrop-blur-md p-3 rounded-2xl shadow-xl border border-white/30 text-2xl transition active:scale-90">
    ⚙️
  </button>

  <!-- Dynamischer Touch-Joystick Overlay -->
  <div id="joystick-container" class="absolute pointer-events-none hidden" style="transform: translate(-50%, -50%); z-index: 10;">
    <div id="joystick-base" class="w-24 h-24 rounded-full bg-white/20 border-2 border-white/50 backdrop-blur-md flex items-center justify-center relative shadow-2xl">
      <div id="joystick-stick" class="w-10 h-10 rounded-full bg-cyan-400 border-2 border-white shadow-lg transition-transform duration-75"></div>
    </div>
  </div>

  <!-- HUD Overlay (Punkte & Länge) -->
  <div id="hud" class="absolute top-4 left-4 right-16 flex justify-between items-center pointer-events-none hidden z-10">
    <div class="bg-slate-900/80 backdrop-blur-md px-4 py-2 rounded-2xl shadow-lg border border-cyan-500/30 text-white font-bold text-base md:text-lg">
      🌟 Punkte: <span id="score-val" class="text-cyan-400">0</span>
    </div>
    <div class="bg-slate-900/80 backdrop-blur-md px-4 py-2 rounded-2xl shadow-lg border border-amber-500/30 text-white font-bold text-xs md:text-sm">
      🐍 Länge: <span id="length-val" class="text-amber-400">5</span>
    </div>
  </div>

  <!-- Startmenü & Leaderboard -->
  <div id="start-menu" class="absolute inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-20 overflow-y-auto">
    <div class="bg-slate-900/95 my-auto p-5 md:p-6 rounded-3xl shadow-2xl border border-cyan-500/30 max-w-md w-full text-center relative overflow-hidden">
      
      <!-- Weltraum-Wurm Banner Foto -->
      <div class="w-full h-36 md:h-44 rounded-2xl overflow-hidden mb-4 relative shadow-inner border border-white/10">
        <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=800&q=80" alt="WormRing Cosmic" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-transparent flex items-end justify-center pb-2">
          <h1 class="text-3xl font-black text-cyan-400 drop-shadow-[0_2px_10px_rgba(34,211,238,0.8)] tracking-wide">🐛 WormRing 3D</h1>
        </div>
      </div>

      <!-- Spielername Input -->
      <div class="mb-4 text-left">
        <label for="player-name" class="block text-xs font-bold text-cyan-300 uppercase mb-1">Dein Spielername</label>
        <input type="text" id="player-name" placeholder="SpaceWorm" maxlength="15" class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl focus:outline-none focus:border-cyan-400 text-white font-bold text-base transition">
      </div>

      <!-- Skin / Farbauswahl -->
      <div class="mb-5 text-left">
        <label class="block text-xs font-bold text-amber-300 uppercase mb-2">Wähle deinen Skin (Farbe)</label>
        <div id="skin-picker" class="flex justify-between items-center bg-slate-800/80 p-2.5 rounded-2xl border border-slate-700">
          <button data-color="0x1982c4" class="skin-opt w-9 h-9 rounded-full bg-cyan-500 border-2 border-white ring-2 ring-cyan-400 scale-110 transition"></button>
          <button data-color="0xff595e" class="skin-opt w-9 h-9 rounded-full bg-rose-500 border-2 border-transparent hover:scale-105 transition"></button>
          <button data-color="0x8ac926" class="skin-opt w-9 h-9 rounded-full bg-lime-500 border-2 border-transparent hover:scale-105 transition"></button>
          <button data-color="0x6a4c93" class="skin-opt w-9 h-9 rounded-full bg-purple-500 border-2 border-transparent hover:scale-105 transition"></button>
          <button data-color="0xffca3a" class="skin-opt w-9 h-9 rounded-full bg-amber-400 border-2 border-transparent hover:scale-105 transition"></button>
          <button data-color="0xff924c" class="skin-opt w-9 h-9 rounded-full bg-orange-500 border-2 border-transparent hover:scale-105 transition"></button>
        </div>
      </div>

      <!-- Start Button -->
      <button id="start-btn" class="w-full py-3.5 bg-gradient-to-r from-cyan-500 to-emerald-500 hover:from-cyan-400 hover:to-emerald-400 active:scale-95 text-white font-black text-lg rounded-2xl shadow-lg shadow-cyan-500/25 transition duration-150 mb-5">
        SPIEL STARTEN ▶
      </button>

      <!-- Leaderboard Liste -->
      <div class="border-t border-slate-800 pt-3 text-left">
        <div class="flex justify-between items-center mb-2">
          <h2 class="text-xs font-bold text-slate-400 uppercase flex items-center gap-1">🏆 Top Highscores</h2>
          <span id="lb-status" class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-950 text-emerald-400 border border-emerald-800 font-bold">Online</span>
        </div>
        <div class="bg-slate-800/50 rounded-2xl p-2.5 border border-slate-800 max-h-36 overflow-y-auto custom-scrollbar">
          <ol id="leaderboard-list" class="text-xs font-semibold text-slate-300 divide-y divide-slate-800/50">
            <li class="py-2 text-center text-slate-500 italic">Lade Bestenliste...</li>
          </ol>
        </div>
      </div>
    </div>
  </div>

  <!-- Einstellungen Modal -->
  <div id="settings-modal" class="absolute inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-slate-900 p-6 rounded-3xl border border-slate-700 max-w-xs w-full text-center shadow-2xl">
      <h2 class="text-2xl font-black text-cyan-400 mb-4">Einstellungen</h2>
      
      <div class="space-y-4 mb-6 text-left">
        <div class="flex justify-between items-center bg-slate-800 p-3 rounded-xl border border-slate-700">
          <span class="text-sm font-bold text-slate-300">🔊 Soundeffekte</span>
          <input type="checkbox" id="sound-toggle" checked class="w-5 h-5 accent-cyan-500">
        </div>
        <button id="reset-scores-btn" class="w-full py-2.5 bg-rose-950/60 hover:bg-rose-900 border border-rose-800 text-rose-300 text-xs font-bold rounded-xl transition">
          Lokale Highscores löschen
        </button>
      </div>

      <button id="close-settings-btn" class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-white font-bold text-sm rounded-xl border border-slate-600 transition">
        Schließen
      </button>
    </div>
  </div>

  <!-- Game Over Screen -->
  <div id="gameover-menu" class="absolute inset-0 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4 z-30 hidden">
    <div class="bg-slate-900 p-6 md:p-8 rounded-3xl shadow-2xl border border-rose-500/40 max-w-sm w-full text-center">
      <div class="text-5xl mb-2">💥</div>
      <h2 class="text-3xl font-black text-rose-500 mb-2">Game Over!</h2>
      <p class="text-slate-400 text-sm mb-4">Du bist zusammengestoßen.</p>
      
      <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 mb-6">
        <div class="text-xs text-amber-400 font-bold uppercase mb-1">Erreichte Punkte</div>
        <div id="final-score" class="text-4xl font-extrabold text-cyan-400">0</div>
      </div>

      <button id="restart-btn" class="w-full py-4 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 active:scale-95 text-white font-black text-xl rounded-2xl shadow-lg shadow-amber-500/20 transition">
        NOCHMAL SPIELEN 🔄
      </button>
    </div>
  </div>

  <script>
    // ==========================================
    // FIREBASE KONFIGURATION (wormring-16620)
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyDK77MSnstrk4Q3XW0-Pd7LEMCQuRd1NjM",
      authDomain: "wormring-16620.firebaseapp.com",
      projectId: "wormring-16620",
      storageBucket: "wormring-16620.firebasestorage.app",
      messagingSenderId: "1066548218415",
      appId: "1:1066548218415:web:25358a6ab6cda5ce11d4da",
      measurementId: "G-QQ0CSTRFR9"
    };

    let db = null;
    let isFirebaseActive = false;

    try {
      if (typeof firebase !== 'undefined') {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        isFirebaseActive = true;
      }
    } catch(e) {
      console.warn("Firebase Init Hinweis:", e);
    }

    // ==========================================
    // EINSTELLUNGEN & SKINS LOGIK
    // ==========================================
    let soundEnabled = true;
    let selectedSkin = 0x1982c4; // Standard Neon Blau

    document.querySelectorAll('.skin-opt').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.skin-opt').forEach(b => {
          b.classList.remove('ring-2', 'ring-cyan-400', 'scale-110');
          b.classList.add('border-transparent');
        });
        const target = e.currentTarget;
        target.classList.add('ring-2', 'ring-cyan-400', 'scale-110');
        target.classList.remove('border-transparent');
        selectedSkin = parseInt(target.getAttribute('data-color'));
      });
    });

    const settingsBtn = document.getElementById('settings-btn');
    const settingsModal = document.getElementById('settings-modal');
    const closeSettingsBtn = document.getElementById('close-settings-btn');
    const soundToggle = document.getElementById('sound-toggle');
    const resetScoresBtn = document.getElementById('reset-scores-btn');

    settingsBtn.addEventListener('click', () => settingsModal.classList.remove('hidden'));
    closeSettingsBtn.addEventListener('click', () => settingsModal.classList.add('hidden'));
    soundToggle.addEventListener('change', (e) => soundEnabled = e.target.checked);
    resetScoresBtn.addEventListener('click', () => {
      if (confirm('Möchtest du die lokalen Highscores löschen?')) {
        localStorage.removeItem('worm_scores');
        loadLeaderboard();
        alert('Lokale Highscores gelöscht!');
      }
    });

    // ==========================================
    // AUDIO SYNTHESIZER (Web Audio API)
    // ==========================================
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playPopSound() {
      if (!soundEnabled || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(450, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch(e){}
    }

    function playHitSound() {
      if (!soundEnabled || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      } catch(e){}
    }

    // ==========================================
    // LEADERBOARD LOGIK
    // ==========================================
    const lbStatusEl = document.getElementById('lb-status');
    const lbListEl = document.getElementById('leaderboard-list');

    function updateLBStatus(online) {
      if (online) {
        lbStatusEl.textContent = "Online Cloud";
        lbStatusEl.className = "text-[10px] px-2 py-0.5 rounded-full bg-emerald-950 text-emerald-400 border border-emerald-800 font-bold";
      } else {
        lbStatusEl.textContent = "Lokal";
        lbStatusEl.className = "text-[10px] px-2 py-0.5 rounded-full bg-amber-950 text-amber-400 border border-amber-800 font-bold";
      }
    }

    function loadLeaderboard() {
      if (isFirebaseActive && db) {
        db.collection("leaderboard")
          .orderBy("score", "desc")
          .limit(10)
          .onSnapshot((snapshot) => {
            updateLBStatus(true);
            const scores = [];
            snapshot.forEach(doc => scores.push(doc.data()));
            renderLeaderboardUI(scores);
          }, (err) => {
            console.warn("Firestore Hinweis, Fallback auf lokal:", err);
            loadLocalLeaderboard();
          });
      } else {
        loadLocalLeaderboard();
      }
    }

    function loadLocalLeaderboard() {
      updateLBStatus(false);
      const local = JSON.parse(localStorage.getItem('worm_scores') || '[]');
      renderLeaderboardUI(local);
    }

    function renderLeaderboardUI(scores) {
      lbListEl.innerHTML = '';
      if (!scores || scores.length === 0) {
        lbListEl.innerHTML = '<li class="py-2 text-center text-slate-500 italic">Noch keine Highscores vorhanden</li>';
        return;
      }
      scores.slice(0, 10).forEach((entry, idx) => {
        const li = document.createElement('li');
        li.className = "py-1.5 flex justify-between items-center font-semibold";
        const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `#${idx + 1}`;
        li.innerHTML = `
          <span class="flex items-center gap-2">
            <span class="w-5 text-center font-bold text-slate-500 text-[10px]">${medal}</span>
            <span class="text-slate-200">${escapeHtml(entry.name || 'Anonym')}</span>
          </span>
          <span class="text-cyan-400 font-black">${Math.floor(entry.score || 0)}</span>
        `;
        lbListEl.appendChild(li);
      });
    }

    async function saveScore(name, score) {
      const cleanScore = Math.floor(score);
      const cleanName = name.trim() || 'WurmPlayer';

      const local = JSON.parse(localStorage.getItem('worm_scores') || '[]');
      local.push({ name: cleanName, score: cleanScore, date: new Date().toISOString() });
      local.sort((a,b) => b.score - a.score);
      localStorage.setItem('worm_scores', JSON.stringify(local.slice(0, 20)));

      if (isFirebaseActive && db) {
        try {
          await db.collection("leaderboard").add({
            name: cleanName,
            score: cleanScore,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        } catch(e) {
          console.error("Fehler beim Speichern:", e);
        }
      }
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    const nameInput = document.getElementById('player-name');
    nameInput.value = localStorage.getItem('worm_player_name') || 'Wurm' + Math.floor(Math.random()*1000);

    // ==========================================
    // THREE.JS & SPIEL ENGINES
    // ==========================================
    const canvas = document.getElementById('game-canvas');
    let renderer, scene, camera;
    let isPlaying = false;
    let animationFrameId = null;

    const SPEED = 0.075; // Angenehme, entspannte Geschwindigkeit
    const SEGMENT_DISTANCE = 0.42;
    const ARENA_SIZE = 40;

    let player;
    let bots = [];
    let foods = [];

    const COLORS = [0x1982c4, 0xff595e, 0x8ac926, 0x6a4c93, 0xffca3a, 0xff924c];

    function initThree() {
      renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f172a); // Stylischer dunkler Cosmic-Hintergrund
      scene.fog = new THREE.FogExp2(0x0f172a, 0.018);

      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 18, 14);
      camera.lookAt(0, 0, 0);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.0);
      dirLight.position.set(20, 40, 20);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // Arena Boden
      const groundGeo = new THREE.PlaneGeometry(ARENA_SIZE * 2, ARENA_SIZE * 2);
      const groundMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.7, metalness: 0.1 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      const grid = new THREE.GridHelper(ARENA_SIZE * 2, 40, 0x38bdf8, 0x334155);
      grid.position.y = 0.01;
      scene.add(grid);

      window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
      if (!camera || !renderer) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // WURM KLASSE (Neues kinematisches Folge-System)
    class Worm {
      constructor(isPlayer = false, color = 0x1982c4, startX = 0, startZ = 0) {
        this.isPlayer = isPlayer;
        this.color = color;
        this.score = 0;
        this.dir = Math.random() * Math.PI * 2;
        this.targetDir = this.dir;
        this.isDead = false;

        this.segments = [];
        this.meshGroup = new THREE.Group();
        scene.add(this.meshGroup);

        const headMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.2, metalness: 0.2 });

        const headGeo = new THREE.SphereGeometry(0.5, 16, 16);
        const headMesh = new THREE.Mesh(headGeo, headMat);
        headMesh.castShadow = true;
        headMesh.position.set(startX, 0.5, startZ);
        this.meshGroup.add(headMesh);
        this.segments.push(headMesh);

        // Augen
        const eyeGeo = new THREE.SphereGeometry(0.12, 8, 8);
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const pupilMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

        const eyeLeft = new THREE.Mesh(eyeGeo, eyeMat);
        eyeLeft.position.set(-0.2, 0.22, 0.3);
        headMesh.add(eyeLeft);
        const pupilLeft = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), pupilMat);
        pupilLeft.position.set(0, 0, 0.08);
        eyeLeft.add(pupilLeft);

        const eyeRight = new THREE.Mesh(eyeGeo, eyeMat);
        eyeRight.position.set(0.2, 0.22, 0.3);
        headMesh.add(eyeRight);
        const pupilRight = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), pupilMat);
        pupilRight.position.set(0, 0, 0.08);
        eyeRight.add(pupilRight);

        // Start-Segmente erzeugen
        for (let i = 0; i < 6; i++) {
          this.addSegment(startX - (i + 1) * SEGMENT_DISTANCE * Math.sin(this.dir), startZ - (i + 1) * SEGMENT_DISTANCE * Math.cos(this.dir));
        }
      }

      addSegment(x, z) {
        const scale = Math.max(0.28, 0.46 - this.segments.length * 0.003);
        const bodyGeo = new THREE.SphereGeometry(scale, 12, 12);
        const bodyMat = new THREE.MeshStandardMaterial({ color: this.color, roughness: 0.3 });
        const mesh = new THREE.Mesh(bodyGeo, bodyMat);
        mesh.castShadow = true;
        mesh.position.set(x, scale, z);
        this.meshGroup.add(mesh);
        this.segments.push(mesh);
      }

      update() {
        if (this.isDead) return;

        // Sanfte Kopf-Rotation
        let diff = this.targetDir - this.dir;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        this.dir += diff * 0.12;

        const head = this.segments[0];
        head.position.x += Math.sin(this.dir) * SPEED;
        head.position.z += Math.cos(this.dir) * SPEED;
        head.rotation.y = this.dir;

        // Spielfeld-Grenzen
        if (Math.abs(head.position.x) > ARENA_SIZE || Math.abs(head.position.z) > ARENA_SIZE) {
          this.die();
          return;
        }

        // PERFEKTIONIERTE KINEMATIK: Jedes Segment folgt exakt dem vorherigen auf direkter Distanzlinie
        for (let i = 1; i < this.segments.length; i++) {
          const prev = this.segments[i - 1];
          const curr = this.segments[i];

          const dx = prev.position.x - curr.position.x;
          const dz = prev.position.z - curr.position.z;
          const dist = Math.hypot(dx, dz);

          if (dist > 0.0001) {
            const angle = Math.atan2(dx, dz);
            curr.position.x = prev.position.x - Math.sin(angle) * SEGMENT_DISTANCE;
            curr.position.z = prev.position.z - Math.cos(angle) * SEGMENT_DISTANCE;
            curr.rotation.y = angle;
          }
        }
      }

      die() {
        if (this.isDead) return;
        this.isDead = true;

        this.segments.forEach(seg => {
          spawnFood(seg.position.x, seg.position.z);
        });

        scene.remove(this.meshGroup);

        if (this.isPlayer) {
          playHitSound();
          onGameOver(this.score);
        }
      }
    }

    // SPATIAL FUTTER SPANNING
    function spawnFood(x = null, z = null) {
      const foodGeo = new THREE.DodecahedronGeometry(0.25);
      const color = COLORS[Math.floor(Math.random() * COLORS.length)];
      const foodMat = new THREE.MeshStandardMaterial({
        color: color,
        roughness: 0.1,
        emissive: color,
        emissiveIntensity: 0.6
      });
      const mesh = new THREE.Mesh(foodGeo, foodMat);
      mesh.castShadow = true;

      const px = x !== null ? x : (Math.random() - 0.5) * (ARENA_SIZE * 1.8);
      const pz = z !== null ? z : (Math.random() - 0.5) * (ARENA_SIZE * 1.8);

      mesh.position.set(px, 0.3, pz);
      scene.add(mesh);
      foods.push(mesh);
    }

    // JOYSTICK STEUERUNG
    const joystickContainer = document.getElementById('joystick-container');
    const joystickStick = document.getElementById('joystick-stick');

    let touchActive = false;
    let touchStartX = 0;
    let touchStartY = 0;

    window.addEventListener('pointerdown', (e) => {
      if (!isPlaying) return;
      if (e.clientY < 70 && e.clientX > window.innerWidth - 70) return;

      initAudio();
      touchActive = true;
      touchStartX = e.clientX;
      touchStartY = e.clientY;

      joystickContainer.style.left = `${touchStartX}px`;
      joystickContainer.style.top = `${touchStartY}px`;
      joystickContainer.classList.remove('hidden');
      joystickStick.style.transform = `translate(0px, 0px)`;
    });

    window.addEventListener('pointermove', (e) => {
      if (!touchActive || !player || player.isDead) return;

      const dx = e.clientX - touchStartX;
      const dy = e.clientY - touchStartY;
      const maxRadius = 40;
      const dist = Math.min(maxRadius, Math.sqrt(dx * dx + dy * dy));

      if (dist > 5) {
        const angle = Math.atan2(dx, dy);
        player.targetDir = angle;

        const moveX = Math.sin(angle) * dist;
        const moveY = Math.cos(angle) * dist;
        joystickStick.style.transform = `translate(${moveX}px, ${moveY}px)`;
      }
    });

    window.addEventListener('pointerup', () => {
      touchActive = false;
      joystickContainer.classList.add('hidden');
    });

    // GAME ANIMATION LOOP
    function animate() {
      if (!isPlaying) return;

      animationFrameId = requestAnimationFrame(animate);

      if (player && !player.isDead) {
        player.update();

        const head = player.segments[0];
        camera.position.x = head.position.x;
        camera.position.z = head.position.z + 14;
        camera.lookAt(head.position.x, 0, head.position.z);

        // Futter fressen
        for (let i = foods.length - 1; i >= 0; i--) {
          const f = foods[i];
          if (head.position.distanceTo(f.position) < 0.8) {
            scene.remove(f);
            foods.splice(i, 1);
            player.score += 10;
            playPopSound();

            if (player.score % 30 === 0) {
              const tail = player.segments[player.segments.length - 1];
              player.addSegment(tail.position.x, tail.position.z);
            }

            document.getElementById('score-val').textContent = player.score;
            document.getElementById('length-val').textContent = player.segments.length;
            spawnFood();
          }
        }

        // Kollision mit Bots
        bots.forEach(bot => {
          if (bot.isDead) return;
          for (let i = 0; i < bot.segments.length; i++) {
            if (head.position.distanceTo(bot.segments[i].position) < 0.65) {
              player.die();
              break;
            }
          }
          const botHead = bot.segments[0];
          for (let i = 0; i < player.segments.length; i++) {
            if (botHead.position.distanceTo(player.segments[i].position) < 0.65) {
              bot.die();
              break;
            }
          }
        });
      }

      // Bots Update
      bots.forEach(bot => {
        if (bot.isDead) return;

        if (Math.random() < 0.02) bot.targetDir += (Math.random() - 0.5) * 1.5;
        const bHead = bot.segments[0];
        if (Math.abs(bHead.position.x) > ARENA_SIZE - 3 || Math.abs(bHead.position.z) > ARENA_SIZE - 3) {
          bot.targetDir = Math.atan2(-bHead.position.x, -bHead.position.z);
        }

        bot.update();

        for (let i = foods.length - 1; i >= 0; i--) {
          if (bHead.position.distanceTo(foods[i].position) < 0.8) {
            scene.remove(foods[i]);
            foods.splice(i, 1);
            bot.score += 10;
            if (bot.score % 40 === 0) {
              const tail = bot.segments[bot.segments.length - 1];
              bot.addSegment(tail.position.x, tail.position.z);
            }
            spawnFood();
          }
        }
      });

      bots = bots.filter(b => !b.isDead);
      while (bots.length < 6) {
        const bx = (Math.random() - 0.5) * (ARENA_SIZE * 1.5);
        const bz = (Math.random() - 0.5) * (ARENA_SIZE * 1.5);
        const color = COLORS[Math.floor(Math.random() * COLORS.length)];
        bots.push(new Worm(false, color, bx, bz));
      }

      const time = Date.now() * 0.003;
      foods.forEach((f, idx) => {
        f.position.y = 0.3 + Math.sin(time + idx) * 0.08;
        f.rotation.y += 0.02;
      });

      renderer.render(scene, camera);
    }

    // SPIEL START & OVER
    function startGame() {
      const name = nameInput.value.trim() || 'WurmPlayer';
      localStorage.setItem('worm_player_name', name);

      if (player) scene.remove(player.meshGroup);
      bots.forEach(b => scene.remove(b.meshGroup));
      foods.forEach(f => scene.remove(f));

      bots = [];
      foods = [];

      // Erstelle den Spieler mit der gewählten Skin-Farbe
      player = new Worm(true, selectedSkin, 0, 0);

      for (let i = 0; i < 50; i++) spawnFood();
      for (let i = 0; i < 6; i++) {
        const bx = (Math.random() - 0.5) * (ARENA_SIZE * 1.5);
        const bz = (Math.random() - 0.5) * (ARENA_SIZE * 1.5);
        const color = COLORS[Math.floor(Math.random() * COLORS.length)];
        bots.push(new Worm(false, color, bx, bz));
      }

      document.getElementById('score-val').textContent = '0';
      document.getElementById('length-val').textContent = player.segments.length;

      document.getElementById('start-menu').classList.add('hidden');
      document.getElementById('gameover-menu').classList.add('hidden');
      document.getElementById('hud').classList.remove('hidden');

      isPlaying = true;
      animate();
    }

    function onGameOver(score) {
      isPlaying = false;
      if (animationFrameId) cancelAnimationFrame(animationFrameId);

      document.getElementById('hud').classList.add('hidden');
      document.getElementById('final-score').textContent = Math.floor(score);
      document.getElementById('gameover-menu').classList.remove('hidden');

      const pName = nameInput.value.trim() || 'WurmPlayer';
      saveScore(pName, score);
    }

    document.getElementById('start-btn').addEventListener('click', () => {
      initAudio();
      startGame();
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
      initAudio();
      loadLeaderboard();
      document.getElementById('gameover-menu').classList.add('hidden');
      document.getElementById('start-menu').classList.remove('hidden');
    });

    initThree();
    loadLeaderboard();
  </script>
</body>
</html>
