<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>WORMRING 3D</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Firebase SDKs via CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #game-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body class="bg-slate-900 text-white">

  <!-- 3D Spiel Canvas -->
  <canvas id="game-canvas"></canvas>

  <!-- Settings Button (Oben rechts auf dem HUD) -->
  <button id="settings-btn" class="absolute top-4 right-4 z-10 bg-slate-800/80 hover:bg-slate-700/80 backdrop-blur-md p-3 rounded-2xl shadow-lg border border-slate-600 text-xl transition active:scale-90">
    ⚙️
  </button>

  <!-- Dynamischer Touch-Joystick Overlay -->
  <div id="joystick-container" class="absolute pointer-events-none hidden" style="transform: translate(-50%, -50%); z-index: 10;">
    <div id="joystick-base" class="w-24 h-24 rounded-full bg-white/20 border-2 border-white/50 backdrop-blur-md flex items-center justify-center relative shadow-2xl">
      <div id="joystick-stick" class="w-10 h-10 rounded-full bg-cyan-400 border-2 border-white shadow-lg transition-transform duration-75"></div>
    </div>
  </div>

  <!-- HUD Overlay (Punkte & Länge) -->
  <div id="hud" class="absolute top-4 left-4 right-20 flex justify-between items-center pointer-events-none hidden z-10">
    <div class="bg-slate-900/80 backdrop-blur-md px-4 py-2 rounded-2xl shadow-lg border border-cyan-500/30 text-white font-bold text-base md:text-lg">
      🌟 Punkte: <span id="score-val" class="text-cyan-400">0</span>
    </div>
    <div class="bg-slate-900/80 backdrop-blur-md px-4 py-2 rounded-2xl shadow-lg border border-amber-500/30 text-white font-bold text-xs md:text-sm">
      🐍 Länge: <span id="length-val" class="text-amber-400">6</span>
    </div>
  </div>

  <!-- Startmenü & Leaderboard -->
  <div id="start-menu" class="absolute inset-0 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4 z-20">
    <div class="bg-slate-900/95 p-6 rounded-3xl shadow-2xl border border-cyan-500/30 max-w-md w-full text-center relative overflow-hidden">
      
      <h1 class="text-4xl font-black text-cyan-400 drop-shadow-[0_2px_10px_rgba(34,211,238,0.8)] tracking-wide mb-1">🐛 WORMRING</h1>
      <p class="text-slate-400 text-xs mb-5"> Tipp : Wenn dein Wurm eine bestimmte größe erreicht hat kreise andere Würmer ein!</p>

      <!-- Spielername Input -->
      <div class="mb-4 text-left">
        <label for="player-name" class="block text-xs font-bold text-cyan-300 uppercase mb-1">Dein Spielername</label>
        <input type="text" id="player-name" placeholder="SpaceWorm" maxlength="15" class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl focus:outline-none focus:border-cyan-400 text-white font-bold text-base transition">
      </div>

      <!-- Start Button -->
      <button id="start-btn" class="w-full py-3.5 bg-gradient-to-r from-cyan-500 to-emerald-500 hover:from-cyan-400 hover:to-emerald-400 active:scale-95 text-white font-black text-lg rounded-2xl shadow-lg shadow-cyan-500/25 transition duration-150 mb-5">
        SPIEL STARTEN ▶
      </button>

      <!-- Leaderboard Liste -->
      <div class="border-t border-slate-800 pt-3 text-left">
        <div class="flex justify-between items-center mb-2">
          <h2 class="text-xs font-bold text-slate-400 uppercase flex items-center gap-1">🏆 Top Highscores</h2>
          <span id="lb-status" class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-950 text-emerald-400 border border-emerald-800 font-bold">Online</span>
        </div>
        <div class="bg-slate-800/50 rounded-2xl p-2.5 border border-slate-800 max-h-36 overflow-y-auto">
          <ol id="leaderboard-list" class="text-xs font-semibold text-slate-300 divide-y divide-slate-800/50">
            <li class="py-2 text-center text-slate-500 italic">Lade Bestenliste...</li>
          </ol>
        </div>
      </div>
    </div>
  </div>

  <!-- Einstellungen Modal -->
  <div id="settings-modal" class="absolute inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-slate-900 p-6 rounded-3xl border border-slate-700 max-w-xs w-full text-center shadow-2xl">
      <h2 class="text-2xl font-black text-cyan-400 mb-4">Einstellungen</h2>
      
      <div class="space-y-4 mb-6 text-left">
        <div class="flex justify-between items-center bg-slate-800 p-3 rounded-xl border border-slate-700">
          <span class="text-sm font-bold text-slate-300">🔊 Soundeffekte</span>
          <input type="checkbox" id="sound-toggle" checked class="w-5 h-5 accent-cyan-500">
        </div>
        <button id="reset-scores-btn" class="w-full py-2.5 bg-rose-950/60 hover:bg-rose-900 border border-rose-800 text-rose-300 text-xs font-bold rounded-xl transition">
          Lokale Highscores löschen
        </button>
      </div>

      <button id="close-settings-btn" class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-white font-bold text-sm rounded-xl border border-slate-600 transition">
        Schließen
      </button>
    </div>
  </div>

  <!-- Game Over Screen -->
  <div id="gameover-menu" class="absolute inset-0 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4 z-30 hidden">
    <div class="bg-slate-900 p-6 rounded-3xl shadow-2xl border border-rose-500/40 max-w-sm w-full text-center">
      <div class="text-5xl mb-2">💥</div>
      <h2 class="text-3xl font-black text-rose-500 mb-2">Game Over!</h2>
      <p class="text-slate-400 text-sm mb-4">Du bist zusammengestoßen.</p>
      
      <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 mb-6">
        <div class="text-xs text-amber-400 font-bold uppercase mb-1">Erreichte Punkte</div>
        <div id="final-score" class="text-4xl font-extrabold text-cyan-400">0</div>
      </div>

      <button id="restart-btn" class="w-full py-4 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 active:scale-95 text-white font-black text-xl rounded-2xl shadow-lg transition">
        NOCHMAL SPIELEN 🔄
      </button>
    </div>
  </div>
