<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>WORMRING 3D</title>
  <!-- Three.js Bibliothek -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      touch-action: none;
    }
    #game-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    
    /* MODALS & OVERLAYS */
    .overlay {
      position: absolute;
      inset: 0;
      background-color: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 20;
    }
    .hidden {
      display: none !important;
    }
    .card {
      background-color: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(6, 182, 212, 0.3);
      border-radius: 1.5rem;
      padding: 1.5rem;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    
    /* BUTTONS */
    .btn {
      width: 100%;
      padding: 0.875rem;
      border-radius: 1rem;
      border: none;
      font-weight: 900;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
    }
    .btn:active {
      transform: scale(0.96);
    }
    .btn-primary {
      background: linear-gradient(to right, #06b6d4, #10b981);
      color: white;
      box-shadow: 0 10px 15px -3px rgba(6, 182, 212, 0.3);
    }
    .btn-secondary {
      background-color: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
    }
    .btn-purple {
      background: linear-gradient(to right, #9333ea, #4f46e5);
      color: white;
    }
    .btn-boost {
      background: linear-gradient(to right, #f59e0b, #ea580c);
      color: white;
      border: 2px solid #fde047;
      box-shadow: 0 10px 20px rgba(245, 158, 11, 0.4);
    }

    /* INPUTS */
    .input-field {
      width: 100%;
      padding: 0.75rem 1rem;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      color: white;
      font-weight: bold;
      margin-bottom: 1rem;
      outline: none;
    }
    .input-field:focus {
      border-color: #06b6d4;
    }

    /* HUD */
    #hud {
      position: absolute;
      top: 1rem;
      left: 1rem;
      right: 1rem;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }
    .score-box {
      background-color: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(4px);
      padding: 0.6rem 1.2rem;
      border-radius: 1rem;
      border: 1px solid rgba(6, 182, 212, 0.3);
      font-weight: bold;
    }

    /* JOYSTICK & BOOST */
    #joystick-container {
      position: absolute;
      transform: translate(-50%, -50%);
      z-index: 10;
      pointer-events: none;
    }
    #joystick-base {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      border: 2px solid rgba(255,255,255,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #joystick-stick {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #06b6d4;
      border: 2px solid white;
    }
    #boost-btn {
      position: absolute;
      bottom: 2rem;
      right: 2rem;
      z-index: 15;
      width: auto;
      padding: 1rem 1.5rem;
    }

    /* GRID PALETTE */
    .color-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.5rem;
      max-height: 120px;
      overflow-y: auto;
      margin-top: 0.5rem;
    }
    .color-btn {
      height: 32px;
      border-radius: 8px;
      border: 2px solid #334155;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <canvas id="game-canvas"></canvas>

  <!-- EINSTELLUNGEN BUTTON -->
  <button id="settings-btn" style="position: absolute; top: 1rem; right: 1rem; z-index: 10; background: #1e293b; border: 1px solid #475569; color: white; padding: 0.6rem 0.8rem; border-radius: 1rem; cursor: pointer;">⚙️</button>

  <!-- JOYSTICK -->
  <div id="joystick-container" class="hidden">
    <div id="joystick-base">
      <div id="joystick-stick"></div>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="score-box">
      <span>🌟 Punkte:</span> <span id="score-val" style="color: #06b6d4;">0</span>
    </div>
  </div>

  <!-- BOOST BUTTON -->
  <button id="boost-btn" class="btn btn-boost hidden">⚡ BOOST</button>

  <!-- STARTMENÜ -->
  <div id="start-menu" class="overlay">
    <div class="card">
      <h1 style="color: #06b6d4; font-size: 2rem; font-weight: 900; margin-bottom: 0.5rem;">🐛 WORMRING 3D</h1>
      <p style="color: #94a3b8; font-size: 0.8rem; margin-bottom: 1.5rem;">Steuere deinen Wurm und sammle Punkte!</p>

      <div style="text-align: left; margin-bottom: 0.5rem;">
        <label style="font-size: 0.75rem; color: #67e8f9; font-weight: bold; display: block; margin-bottom: 0.25rem;">SPIELERNAME</label>
        <input type="text" id="player-name" class="input-field" value="SpaceWorm" maxlength="15">
      </div>

      <button id="start-btn" class="btn btn-primary" style="margin-bottom: 0.75rem;">SPIEL STARTEN ▶</button>
      
      <div style="display: flex; gap: 0.5rem;">
        <button id="open-skin-btn" class="btn btn-purple" style="font-size: 0.8rem;">🎨 Skins</button>
        <button id="open-settings-btn" class="btn btn-secondary" style="font-size: 0.8rem;">⚙️ Option</button>
      </div>
    </div>
  </div>

  <!-- SKIN MODAL -->
  <div id="skin-modal" class="overlay hidden">
    <div class="card" style="border-color: rgba(147, 51, 234, 0.4);">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1rem;">
        <h2 style="color: #c084fc; font-weight: 900;">🎨 Skin Farbe</h2>
        <button id="close-skin-btn" style="background:none; border:none; color:#94a3b8; font-size:1.2rem; cursor:pointer;">✕</button>
      </div>

      <div style="background:#020617; border-radius:1rem; height:80px; margin-bottom:1rem; overflow:hidden;">
        <canvas id="skin-preview-canvas" style="width:100%; height:100%;"></canvas>
      </div>

      <div style="text-align:left; margin-bottom: 1rem;">
        <span style="font-size: 0.75rem; color: #67e8f9; font-weight: bold;">WÄHLE EINE FARBE:</span>
        <div id="color-palette" class="color-grid"></div>
      </div>

      <button id="save-skin-btn" class="btn btn-purple">Fertig</button>
    </div>
  </div>

  <!-- GAMEOVER MODAL -->
  <div id="gameover-menu" class="overlay hidden">
    <div class="card" style="border-color: rgba(244, 63, 94, 0.4);">
      <div style="font-size: 3rem;">💥</div>
      <h2 style="color: #f43f5e; font-size: 1.8rem; font-weight: 900; margin-bottom: 0.5rem;">Game Over!</h2>
      <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 1rem;">Du bist zusammengestoßen.</p>
      
      <div style="background: #1e293b; padding: 1rem; border-radius: 1rem; margin-bottom: 1.5rem;">
        <div style="color: #fbbf24; font-size: 0.75rem; font-weight: bold;">PUNKTE</div>
        <div id="final-score" style="color: #06b6d4; font-size: 2.5rem; font-weight: 900;">0</div>
      </div>

      <button id="restart-btn" class="btn btn-boost">NOCHMAL SPIELEN 🔄</button>
    </div>
  </div>

  <script>
    // PRÜFEN OB THREE.JS GELADEN IST
    if (typeof THREE === 'undefined') {
      alert("Fehler: Three.js konnte nicht geladen werden. Bitte überprüfe deine Internetverbindung!");
    }

    // FARBEN
    const COLORS = ["#06b6d4", "#10b981", "#ef4444", "#f59e0b", "#8b5cf6", "#ec4899", "#3b82f6", "#ffffff"];
    let selectedColor = "#06b6d4";

    // THREE.JS VARIABLE
    let scene, camera, renderer;
    let isPlaying = false;
    let animId = null;

    let player;
    let foods = [];
    let bots = [];
    const ARENA_SIZE = 60;

    // PALETTE RENDERN
    const paletteContainer = document.getElementById('color-palette');
    COLORS.forEach(hex => {
      const b = document.createElement('div');
      b.className = 'color-btn';
      b.style.backgroundColor = hex;
      b.onclick = () => { selectedColor = hex; initPreview(); };
      paletteContainer.appendChild(b);
    });

    // 3D PREVIEW IM SKIN MENÜ
    let pScene, pCam, pRen;
    function initPreview() {
      const pCanvas = document.getElementById('skin-preview-canvas');
      if(!pRen) pRen = new THREE.WebGLRenderer({ canvas: pCanvas, antialias: true, alpha: true });
      pRen.setSize(pCanvas.clientWidth, pCanvas.clientHeight);
      
      pScene = new THREE.Scene();
      pCam = new THREE.PerspectiveCamera(40, pCanvas.clientWidth / pCanvas.clientHeight, 0.1, 10);
      pCam.position.z = 3;

      const light = new THREE.AmbientLight(0xffffff, 1);
      pScene.add(light);

      const geo = new THREE.SphereGeometry(0.8, 16, 16);
      const mat = new THREE.MeshBasicMaterial({ color: selectedColor });
      const mesh = new THREE.Mesh(geo, mat);
      pScene.add(mesh);

      pRen.render(pScene, pCam);
    }

    // THREE.JS ENGINE SETUP
    function initEngine() {
      const canvas = document.getElementById('game-canvas');
      
      try {
        renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
      } catch(e) {
        alert("Dein Browser/Gerät unterstützt kein WebGL!");
        return;
      }

      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      scene = new THREE.Scene();
      scene.background = new THREE.Color("#0f172a");

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 300);
      camera.position.set(0, 40, 0);
      camera.lookAt(0, 0, 0);

      const light = new THREE.AmbientLight(0xffffff, 0.9);
      scene.add(light);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
      dirLight.position.set(20, 40, 20);
      scene.add(dirLight);

      // Boden
      const gGeo = new THREE.PlaneGeometry(ARENA_SIZE * 2, ARENA_SIZE * 2);
      const gMat = new THREE.MeshBasicMaterial({ color: 0x1e293b, side: THREE.DoubleSide });
      const ground = new THREE.Mesh(gGeo, gMat);
      ground.rotation.x = Math.PI / 2;
      scene.add(ground);

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    // WURM KLASSE
    class Worm {
      constructor(isPlayer, color, x, z) {
        this.isPlayer = isPlayer;
        this.color = color;
        this.score = 0;
        this.dir = Math.random() * Math.PI * 2;
        this.targetDir = this.dir;
        this.isDead = false;

        this.group = new THREE.Group();
        scene.add(this.group);

        this.segments = [];
        const headGeo = new THREE.SphereGeometry(0.5, 12, 12);
        const headMat = new THREE.MeshBasicMaterial({ color: this.color });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.set(x, 0.5, z);
        
        this.group.add(head);
        this.segments.push(head);

        for (let i = 0; i < 5; i++) {
          this.addSegment(x, z);
        }
      }

      addSegment(x, z) {
        const geo = new THREE.SphereGeometry(0.4, 10, 10);
        const mat = new THREE.MeshBasicMaterial({ color: this.color });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x, 0.4, z);
        this.group.add(mesh);
        this.segments.push(mesh);
      }

      update() {
        if (this.isDead) return;

        // Drehen
        let diff = this.targetDir - this.dir;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        this.dir += Math.max(-0.08, Math.min(0.08, diff));

        // Kopf bewegen
        const head = this.segments[0];
        const speed = 0.1;
        head.position.x += Math.sin(this.dir) * speed;
        head.position.z += Math.cos(this.dir) * speed;

        // Wand-Kollision
        if (Math.abs(head.position.x) > ARENA_SIZE || Math.abs(head.position.z) > ARENA_SIZE) {
          this.die();
          return;
        }

        // Segmente folgen lassen
        for (let i = this.segments.length - 1; i > 0; i--) {
          const seg = this.segments[i];
          const prev = this.segments[i - 1];
          seg.position.lerp(prev.position, 0.3);
        }
      }

      die() {
        this.isDead = true;
        scene.remove(this.group);
        if (this.isPlayer) {
          gameOver();
        }
      }
    }

    function spawnFood() {
      const geo = new THREE.SphereGeometry(0.25, 8, 8);
      const mat = new THREE.MeshBasicMaterial({ color: 0xeab308 });
      const mesh = new THREE.Mesh(geo, mat);

      const px = (Math.random() - 0.5) * (ARENA_SIZE * 1.8);
      const pz = (Math.random() - 0.5) * (ARENA_SIZE * 1.8);

      mesh.position.set(px, 0.25, pz);
      scene.add(mesh);
      foods.push(mesh);
    }

    // GAMEPLAY CONTROLS
    let touchX = 0, touchY = 0;
    window.addEventListener('pointerdown', (e) => {
      if (!isPlaying || e.target.closest('button')) return;
      touchX = e.clientX;
      touchY = e.clientY;
      document.getElementById('joystick-container').style.left = touchX + 'px';
      document.getElementById('joystick-container').style.top = touchY + 'px';
      document.getElementById('joystick-container').classList.remove('hidden');
    });

    window.addEventListener('pointermove', (e) => {
      if (!isPlaying || document.getElementById('joystick-container').classList.contains('hidden')) return;
      const dx = e.clientX - touchX;
      const dy = e.clientY - touchY;
      if (Math.hypot(dx, dy) > 5 && player) {
        player.targetDir = Math.atan2(dx, dy);
      }
    });

    window.addEventListener('pointerup', () => {
      document.getElementById('joystick-container').classList.add('hidden');
    });

    // LOOP
    function animate() {
      if (!isPlaying) return;
      animId = requestAnimationFrame(animate);

      if (player && !player.isDead) {
        player.update();
        camera.position.x = player.segments[0].position.x;
        camera.position.z = player.segments[0].position.z + 20;
        camera.lookAt(player.segments[0].position);

        // Futter
        for (let i = foods.length - 1; i >= 0; i--) {
          if (player.segments[0].position.distanceTo(foods[i].position) < 0.7) {
            scene.remove(foods[i]);
            foods.splice(i, 1);
            player.score += 10;
            player.addSegment(player.segments[0].position.x, player.segments[0].position.z);
            document.getElementById('score-val').textContent = player.score;
            spawnFood();
          }
        }
      }

      renderer.render(scene, camera);
    }

    function startGame() {
      if (player) scene.remove(player.group);
      foods.forEach(f => scene.remove(f));
      foods = [];

      player = new Worm(true, selectedColor, 0, 0);

      for (let i = 0; i < 50; i++) spawnFood();

      document.getElementById('start-menu').classList.add('hidden');
      document.getElementById('gameover-menu').classList.add('hidden');
      document.getElementById('hud').classList.remove('hidden');
      document.getElementById('boost-btn').classList.remove('hidden');

      isPlaying = true;
      animate();
    }

    function gameOver() {
      isPlaying = false;
      if (animId) cancelAnimationFrame(animId);

      document.getElementById('hud').classList.add('hidden');
      document.getElementById('boost-btn').classList.add('hidden');
      document.getElementById('final-score').textContent = player ? player.score : 0;
      document.getElementById('gameover-menu').classList.remove('hidden');
    }

    // UI ACTIONS
    document.getElementById('start-btn').onclick = startGame;
    document.getElementById('restart-btn').onclick = startGame;
    document.getElementById('open-skin-btn').onclick = () => {
      document.getElementById('skin-modal').classList.remove('hidden');
      initPreview();
    };
    document.getElementById('close-skin-btn').onclick = () => document.getElementById('skin-modal').classList.add('hidden');
    document.getElementById('save-skin-btn').onclick = () => document.getElementById('skin-modal').classList.add('hidden');

    // INITIALISIEREN
    initEngine();
  </script>
</body>
</html>
