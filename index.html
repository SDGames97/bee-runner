<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bee Runner 3D</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #87ceeb;
            font-family: Arial, sans-serif;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #hud {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
            pointer-events: none;
            z-index: 10;
        }
    </style>
    <!-- Three.js Bibliothek einbinden -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="hud">
    <div>🍯 <span id="honey">0</span></div>
    <div>🪙 <span id="coins">0</span></div>
    <div>❤️ <span id="lives">3</span></div>
</div>

<div id="game-container"></div>

<script>
// ==========================================
// 1. SZENE, KAMERA & RENDERER SETUP
// ==========================================
const container = document.getElementById('game-container');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb); // Himmelblau
scene.fog = new THREE.FogExp2(0x87ceeb, 0.015); // Sanfter Nebel in der Ferne

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
// Kamera leicht hinter und über der Biene platzieren (Subway Surfers Look)
camera.position.set(0, 3.5, 6);
camera.rotation.x = -0.2;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// ==========================================
// 2. BELEUCHTUNG (Sonne & Schatten)
// ==========================================
const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xfffaed, 1.2);
sunLight.position.set(5, 12, 5);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 1024;
sunLight.shadow.mapSize.height = 1024;
scene.add(sunLight);

// ==========================================
// 3. FAHRBAHN (Waben-Pfad & Holzleisten)
// ==========================================
const lanePositions = [-2, 0, 2]; // X-Koordinaten der 3 Spuren

// Boden-Material (Gold-Gelb mit Glanz)
const trackMaterial = new THREE.MeshStandardMaterial({ 
    color: 0xf5b014, 
    roughness: 0.3,
    metalness: 0.1 
});

const trackGeometry = new THREE.PlaneGeometry(7.5, 200);
const track = new THREE.Mesh(trackGeometry, trackMaterial);
track.rotation.x = -Math.PI / 2;
track.position.z = -90;
track.receiveShadow = true;
scene.add(track);

// Holzleisten als Spur-Trenner
const woodMaterial = new THREE.MeshStandardMaterial({ color: 0x5c3a21 });
[-1, 1].forEach(x => {
    const railGeometry = new THREE.BoxGeometry(0.2, 0.2, 200);
    const rail = new THREE.Mesh(railGeometry, woodMaterial);
    rail.position.set(x, 0.1, -90);
    rail.castShadow = true;
    rail.receiveShadow = true;
    scene.add(rail);
});

// ==========================================
// 4. SPIELER (BIENE)
// ==========================================
const playerGroup = new THREE.Group();

// Bienen-Körper
const bodyGeo = new THREE.SphereGeometry(0.6, 16, 16);
bodyGeo.scale(1, 0.8, 1.2);
const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, roughness: 0.4 });
const body = new THREE.Mesh(bodyGeo, bodyMat);
body.castShadow = true;
playerGroup.add(body);

// Flügel (Transparent)
const wingGeo = new THREE.BufferGeometry();
const wingMat = new THREE.MeshStandardMaterial({ 
    color: 0xffffff, 
    transparent: true, 
    opacity: 0.7, 
    roughness: 0.1 
});

const leftWing = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.05, 0.4), wingMat);
leftWing.position.set(-0.6, 0.4, 0);
leftWing.rotation.z = 0.2;
playerGroup.add(leftWing);

const rightWing = leftWing.clone();
rightWing.position.x = 0.6;
rightWing.rotation.z = -0.2;
playerGroup.add(rightWing);

playerGroup.position.set(0, 1, 0);
scene.add(playerGroup);

// Spieler-Status
const player = {
    lane: 1,
    targetX: 0,
    y: 1,
    jumping: false,
    jumpVelocity: 0,
    gravity: -0.015
};

// ==========================================
// 5. STEUERUNG (Tastatur & Touch/Swipe)
// ==========================================
function moveLeft() {
    if (player.lane > 0) {
        player.lane--;
        player.targetX = lanePositions[player.lane];
    }
}

function moveRight() {
    if (player.lane < 2) {
        player.lane++;
        player.targetX = lanePositions[player.lane];
    }
}

function jump() {
    if (!player.jumping) {
        player.jumping = true;
        player.jumpVelocity = 0.28;
    }
}

window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft();
    if (e.key === 'ArrowRight' || e.key === 'd') moveRight();
    if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w') jump();
});

let touchStartX = 0;
let touchStartY = 0;
window.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
});
window.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 30) moveRight();
        else if (dx < -30) moveLeft();
    } else {
        if (dy < -30) jump();
    }
});

// ==========================================
// 6. GAME LOOP & UPDATE
// ==========================================
function update() {
    // Sanfte Spurwechsel-Animation (Lerp)
    playerGroup.position.x += (player.targetX - playerGroup.position.x) * 0.15;

    // Sprung-Physik
    if (player.jumping) {
        player.y += player.jumpVelocity;
        player.jumpVelocity += player.gravity;
        if (player.y <= 1) {
            player.y = 1;
            player.jumping = false;
        }
    }
    playerGroup.position.y = player.y;

    // Flügel-Flatter-Animation
    const wingFlap = Math.sin(Date.now() * 0.03) * 0.2;
    leftWing.rotation.z = 0.2 + wingFlap;
    rightWing.rotation.z = -0.2 - wingFlap;

    // Kamera folgt der Biene leicht verzögert
    camera.position.x = playerGroup.position.x * 0.3;
}

function animate() {
    requestAnimationFrame(animate);
    update();
    renderer.render(scene, camera);
}

animate();

// Fenster-Skalierung
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
