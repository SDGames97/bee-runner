<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bee Runner 3D</title>
    
    <!-- iOS Web App Einstellungen -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bee Runner">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #87ceeb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            touch-action: none;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #hud {
            position: fixed;
            top: env(safe-area-inset-top, 20px);
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 22px;
            font-weight: 800;
            color: white;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
            pointer-events: none;
            z-index: 10;
        }
        /* Style für das aufsteigende "+20P" Text-Popup */
        .score-popup {
            position: fixed;
            font-size: 32px;
            font-weight: 900;
            color: #ffea00;
            text-shadow: 0 0 10px #ff6a00, 2px 2px 0px #000;
            pointer-events: none;
            z-index: 20;
            animation: floatUp 0.8s ease-out forwards;
        }
        @keyframes floatUp {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            50% { transform: translate(-50%, -100%) scale(1.3); opacity: 1; }
            100% { transform: translate(-50%, -150%) scale(1); opacity: 0; }
        }
    </style>
    <!-- Three.js 3D Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="hud">
    <div>🍯 <span id="honey">0</span></div>
    <div>🪙 <span id="coins">0</span></div>
    <div>❤️ <span id="lives">3</span></div>
</div>

<div id="game-container"></div>

<script>
// ==========================================
// 1. SETUP & KAMERA
// ==========================================
const container = document.getElementById('game-container');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x76c7f5); // Helles Himmelblau
scene.fog = new THREE.FogExp2(0x76c7f5, 0.012);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 3.8, 6.5);
camera.rotation.x = -0.22;

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// ==========================================
// 2. BELEUCHTUNG & ATMOSPHÄRE
// ==========================================
const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xfff5d6, 1.4);
sunLight.position.set(5, 15, 5);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 1024;
sunLight.shadow.mapSize.height = 1024;
scene.add(sunLight);

// ==========================================
// 3. FAHRBAHN (Waben-Gelb & Holzleisten)
// ==========================================
const lanePositions = [-2.2, 0, 2.2];

const trackGeometry = new THREE.PlaneGeometry(8, 300);
const trackMaterial = new THREE.MeshStandardMaterial({ 
    color: 0xf5ab18, 
    roughness: 0.35,
    metalness: 0.1 
});
const track = new THREE.Mesh(trackGeometry, trackMaterial);
track.rotation.x = -Math.PI / 2;
track.position.z = -140;
track.receiveShadow = true;
scene.add(track);

// Holzleisten-Trenner
const woodMaterial = new THREE.MeshStandardMaterial({ color: 0x5a3418, roughness: 0.6 });
[-1.1, 1.1].forEach(x => {
    const railGeometry = new THREE.BoxGeometry(0.25, 0.25, 300);
    const rail = new THREE.Mesh(railGeometry, woodMaterial);
    rail.position.set(x, 0.125, -140);
    rail.castShadow = true;
    rail.receiveShadow = true;
    scene.add(rail);
});

// ==========================================
// 4. SPIELER (BIENE)
// ==========================================
const playerGroup = new THREE.Group();

const bodyGeo = new THREE.SphereGeometry(0.65, 16, 16);
bodyGeo.scale(1, 0.85, 1.2);
const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, roughness: 0.3 });
const body = new THREE.Mesh(bodyGeo, bodyMat);
body.castShadow = true;
playerGroup.add(body);

// Bienen-Streifen
const stripeGeo = new THREE.CylinderGeometry(0.66, 0.66, 0.25, 16);
const stripeMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5 });
const stripe1 = new THREE.Mesh(stripeGeo, stripeMat);
stripe1.rotation.x = Math.PI / 2;
stripe1.position.z = -0.1;
playerGroup.add(stripe1);

// Transparente Flügel
const wingMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
const wingGeo = new THREE.BoxGeometry(0.85, 0.04, 0.45);

const leftWing = new THREE.Mesh(wingGeo, wingMat);
leftWing.position.set(-0.65, 0.45, -0.1);
playerGroup.add(leftWing);

const rightWing = leftWing.clone();
rightWing.position.x = 0.65;
playerGroup.add(rightWing);

playerGroup.position.set(0, 1.1, 0);
scene.add(playerGroup);

const player = {
    lane: 1,
    targetX: 0,
    y: 1.1,
    jumping: false,
    jumpVelocity: 0,
    gravity: -0.016
};

// ==========================================
// 5. ITEM GENERATOR (MÜNZEN, POWERUPS, HINDERNISSE)
// ==========================================
const items = [];
let coinsCount = 0;
let honeyCount = 0;
let livesCount = 3;

function createGlowAura(color) {
    const auraGeo = new THREE.SphereGeometry(0.8, 16, 16);
    const auraMat = new THREE.MeshBasicMaterial({
        color: color,
        transparent: true,
        opacity: 0.35,
        side: THREE.BackSide
    });
    return new THREE.Mesh(auraGeo, auraMat);
}

function spawnItem() {
    const lane = Math.floor(Math.random() * 3);
    const rand = Math.random();
    
    let group = new THREE.Group();
    let type = '';

    if (rand < 0.45) {
        // MÜNZE (🪙)
        type = 'coin';
        const coinGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.12, 16);
        const coinMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.9, roughness: 0.1 });
        const mesh = new THREE.Mesh(coinGeo, coinMat);
        mesh.rotation.x = Math.PI / 2;
        group.add(mesh);
        group.position.set(lanePositions[lane], 1.2, -70);

    } else if (rand < 0.65) {
        // HONIGTOPF (🍯)
        type = 'pot';
        const potGeo = new THREE.CylinderGeometry(0.45, 0.55, 0.8, 16);
        const potMat = new THREE.MeshStandardMaterial({ color: 0xd2691e, roughness: 0.4 });
        const pot = new THREE.Mesh(potGeo, potMat);
        
        // Honig-Deckel
        const topGeo = new THREE.SphereGeometry(0.48, 12, 12);
        const topMat = new THREE.MeshStandardMaterial({ color: 0xffaa00, roughness: 0.2 });
        const top = new THREE.Mesh(topGeo, topMat);
        top.position.y = 0.4;
        pot.add(top);

        group.add(pot);
        group.position.set(lanePositions[lane], 1.0, -70);

    } else if (rand < 0.80) {
        // BLANKE HINDRNISSE (Waben-Block)
        type = 'obstacle';
        const obsGeo = new THREE.BoxGeometry(1.6, 1.8, 1.2);
        const obsMat = new THREE.MeshStandardMaterial({ color: 0xe09612, roughness: 0.5 });
        const mesh = new THREE.Mesh(obsGeo, obsMat);
        group.add(mesh);
        group.position.set(lanePositions[lane], 0.9, -70);

    } else if (rand < 0.90) {
        // ROTES HERZ MIT GELBER AURA (❤️)
        type = 'heart';
        const heartShape = new THREE.Shape();
        heartShape.moveTo(0, 0);
        heartShape.bezierCurveTo(0, 0.3, -0.5, 0.6, -0.5, 0);
        heartShape.bezierCurveTo(-0.5, -0.4, 0, -0.6, 0, -0.9);
        heartShape.bezierCurveTo(0, -0.6, 0.5, -0.4, 0.5, 0);
        heartShape.bezierCurveTo(0.5, 0.6, 0, 0.3, 0, 0);

        const extrudeSettings = { depth: 0.2, bevelEnabled: true, bevelSegments: 3, steps: 1, bevelSize: 0.08, bevelThickness: 0.08 };
        const heartGeo = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
        const heartMat = new THREE.MeshStandardMaterial({ color: 0xff1133, roughness: 0.2 });
        const heartMesh = new THREE.Mesh(heartGeo, heartMat);
        heartMesh.scale.set(0.6, 0.6, 0.6);
        heartMesh.rotation.z = Math.PI;
        group.add(heartMesh);

        // Gelber Glow
        const aura = createGlowAura(0xffea00);
        group.add(aura);

        group.position.set(lanePositions[lane], 1.4, -70);

    } else {
        // BLAUER SCHILD MIT AURA (🛡️️)
        type = 'shield';
        const shieldGeo = new THREE.CylinderGeometry(0.5, 0.1, 0.9, 3);
        const shieldMat = new THREE.MeshStandardMaterial({ color: 0x0077ff, metalness: 0.5, roughness: 0.2 });
        const shieldMesh = new THREE.Mesh(shieldGeo, shieldMat);
        shieldMesh.rotation.y = Math.PI;
        group.add(shieldMesh);

        // Blauer Glow
        const aura = createGlowAura(0x00d9ff);
        group.add(aura);

        group.position.set(lanePositions[lane], 1.4, -70);
    }

    group.traverse(child => { if(child.isMesh) child.castShadow = true; });
    group.userData = { type: type, lane: lane };
    scene.add(group);
    items.push(group);
}

setInterval(spawnItem, 1100);

// Visual Popup (+20P)
function showScorePopup(text, x, y) {
    const popup = document.createElement('div');
    popup.className = 'score-popup';
    popup.innerText = text;
    popup.style.left = x + 'px';
    popup.style.top = y + 'px';
    document.body.appendChild(popup);
    setTimeout(() => popup.remove(), 800);
}

// ==========================================
// 6. STEUERUNG
// ==========================================
function moveLeft() {
    if (player.lane > 0) {
        player.lane--;
        player.targetX = lanePositions[player.lane];
    }
}

function moveRight() {
    if (player.lane < 2) {
        player.lane++;
        player.targetX = lanePositions[player.lane];
    }
}

function jump() {
    if (!player.jumping) {
        player.jumping = true;
        player.jumpVelocity = 0.3;
    }
}

let touchStartX = 0;
let touchStartY = 0;
window.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
}, { passive: false });

window.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 30) moveRight();
        else if (dx < -30) moveLeft();
    } else {
        if (dy < -30) jump();
    }
}, { passive: false });

window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') moveLeft();
    if (e.key === 'ArrowRight') moveRight();
    if (e.key === 'ArrowUp' || e.key === ' ') jump();
});

// ==========================================
// 7. GAME LOOP & KOLLISIONEN
// ==========================================
function update() {
    // Sanfte Bewegung der Biene
    playerGroup.position.x += (player.targetX - playerGroup.position.x) * 0.18;

    // Sprung
    if (player.jumping) {
        player.y += player.jumpVelocity;
        player.jumpVelocity += player.gravity;
        if (player.y <= 1.1) {
            player.y = 1.1;
            player.jumping = false;
        }
    }
    playerGroup.position.y = player.y;

    // Flügel-Flattern
    const flap = Math.sin(Date.now() * 0.035) * 0.25;
    leftWing.rotation.z = 0.2 + flap;
    rightWing.rotation.z = -0.2 - flap;

    // Items bewegen & Logik
    const gameSpeed = 0.38;
    for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        item.position.z += gameSpeed;

        // Eigene Animationen
        if (item.userData.type === 'coin' || item.userData.type === 'heart' || item.userData.type === 'shield') {
            item.rotation.y += 0.04; // Sanfte Drehung
        }

        // Kollision mit Spieler
        if (Math.abs(item.position.z - playerGroup.position.z) < 0.8 &&
            Math.abs(item.position.x - playerGroup.position.x) < 0.8 &&
            Math.abs(item.position.y - playerGroup.position.y) < 1.0) {
            
            const type = item.userData.type;

            if (type === 'coin') {
                coinsCount += 1;
                document.getElementById('coins').innerText = coinsCount;
            } else if (type === 'pot') {
                honeyCount += 20;
                document.getElementById('honey').innerText = honeyCount;
                // Pop-up Effekt genau in der Mitte anzeigen!
                showScorePopup('+20P', window.innerWidth / 2, window.innerHeight / 2);
            } else if (type === 'heart') {
                livesCount += 1;
                document.getElementById('lives').innerText = livesCount;
            } else if (type === 'shield') {
                showScorePopup('SCHILD!', window.innerWidth / 2, window.innerHeight / 3);
            } else if (type === 'obstacle') {
                if (livesCount > 0) {
                    livesCount -= 1;
                    document.getElementById('lives').innerText = livesCount;
                }
            }

            scene.remove(item);
            items.splice(i, 1);
            continue;
        }

        // Hinter der Kamera löschen
        if (item.position.z > 10) {
            scene.remove(item);
            items.splice(i, 1);
        }
    }
}

function animate() {
    requestAnimationFrame(animate);
    update();
    renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
