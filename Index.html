<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Bee Runner</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #87ceeb;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #hud {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-family: Arial, sans-serif;
            font-size: 20px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
        }
    </style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
    <div>🍯 <span id="honey">0</span></div>
    <div>🪙 <span id="coins">0</span></div>
    <div>❤️ <span id="lives">3</span></div>
</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let width;
let height;

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();


// ==============================
// PLAYER
// ==============================

const player = {
    lane: 1,
    x: 0,
    y: 0,

    width: 55,
    height: 45,

    targetX: 0,

    jumping: false,
    jumpVelocity: 0,
    gravity: 0.8
};


// ==============================
// GAME
// ==============================

let honey = 0;
let coins = 0;
let lives = 3;

let speed = 7;

let objects = [];


// ==============================
// LANES
// ==============================

function getLaneX(lane) {

    const laneWidth = width / 3;

    return laneWidth * lane + laneWidth / 2;
}


// ==============================
// RESET PLAYER POSITION
// ==============================

function resetPlayer() {

    player.x = getLaneX(player.lane);
    player.targetX = player.x;

    player.y = height - 150;
}

resetPlayer();


// ==============================
// LANE MOVEMENT
// ==============================

function moveLeft() {

    if (player.lane > 0) {
        player.lane--;
        player.targetX = getLaneX(player.lane);
    }
}

function moveRight() {

    if (player.lane < 2) {
        player.lane++;
        player.targetX = getLaneX(player.lane);
    }
}


// ==============================
// JUMP
// ==============================

function jump() {

    if (!player.jumping) {

        player.jumping = true;
        player.jumpVelocity = -15;
    }
}


// ==============================
// TOUCH CONTROLS
// ==============================

let touchStartX = 0;
let touchStartY = 0;

canvas.addEventListener("touchstart", function(e) {

    const touch = e.touches[0];

    touchStartX = touch.clientX;
    touchStartY = touch.clientY;

}, { passive: false });


canvas.addEventListener("touchend", function(e) {

    const touch = e.changedTouches[0];

    const dx = touch.clientX - touchStartX;
    const dy = touch.clientY - touchStartY;

    const minSwipe = 40;

    if (Math.abs(dx) > Math.abs(dy)) {

        if (dx > minSwipe) {
            moveRight();
        }

        else if (dx < -minSwipe) {
            moveLeft();
        }

    } else {

        if (dy < -minSwipe) {
            jump();
        }
    }

}, { passive: false });


// ==============================
// KEYBOARD – FÜR TESTEN
// ==============================

window.addEventListener("keydown", function(e) {

    if (e.key === "ArrowLeft") {
        moveLeft();
    }

    if (e.key === "ArrowRight") {
        moveRight();
    }

    if (e.key === "ArrowUp" || e.key === " ") {
        jump();
    }

});


// ==============================
// DRAW BACKGROUND
// ==============================

function drawBackground() {

    // Himmel
    ctx.fillStyle = "#87ceeb";
    ctx.fillRect(0, 0, width, height);

    // Wolken
    ctx.fillStyle = "rgba(255,255,255,0.8)";

    ctx.beginPath();
    ctx.arc(width * 0.2, height * 0.2, 30, 0, Math.PI * 2);
    ctx.arc(width * 0.24, height * 0.2, 40, 0, Math.PI * 2);
    ctx.arc(width * 0.29, height * 0.2, 25, 0, Math.PI * 2);
    ctx.fill();

    // Boden
    ctx.fillStyle = "#d99b36";
    ctx.fillRect(0, height - 100, width, 100);

    // Waben-Linien
    ctx.strokeStyle = "#f4c95d";
    ctx.lineWidth = 3;

    const size = 40;

    for (let x = -size; x < width + size; x += size * 1.5) {

        for (let y = height - 100; y < height; y += size * 0.9) {

            ctx.beginPath();

            for (let i = 0; i < 6; i++) {

                const angle = Math.PI / 3 * i;

                const px =
                    x + Math.cos(angle) * size / 2;

                const py =
                    y + Math.sin(angle) * size / 2;

                if (i === 0) {
                    ctx.moveTo(px, py);
                } else {
                    ctx.lineTo(px, py);
                }
            }

            ctx.closePath();
            ctx.stroke();
        }
    }
}


// ==============================
// DRAW LANES
// ==============================

function drawLanes() {

    ctx.strokeStyle = "rgba(255,255,255,0.25)";
    ctx.lineWidth = 5;

    for (let i = 1; i < 3; i++) {

        const x = width / 3 * i;

        ctx.beginPath();
        ctx.moveTo(x, height - 100);
        ctx.lineTo(x, height);
        ctx.stroke();
    }
}


// ==============================
// DRAW BEE
// ==============================

function drawBee() {

    const x = player.x;
    const y = player.y;

    // Flügel
    ctx.fillStyle = "rgba(255,255,255,0.75)";

    ctx.beginPath();
    ctx.ellipse(
        x - 18,
        y - 20,
        18,
        12,
        -0.4,
        0,
        Math.PI * 2
    );
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(
        x + 18,
        y - 20,
        18,
        12,
        0.4,
        0,
        Math.PI * 2
    );
    ctx.fill();

    // Körper
    ctx.fillStyle = "#ffc928";

    ctx.beginPath();
    ctx.ellipse(
        x,
        y,
        27,
        22,
        0,
        0,
        Math.PI * 2
    );
    ctx.fill();

    // Streifen
    ctx.strokeStyle = "#222";
    ctx.lineWidth = 6;

    ctx.beginPath();
    ctx.moveTo(x - 8, y - 19);
    ctx.lineTo(x - 8, y + 19);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(x + 8, y - 18);
    ctx.lineTo(x + 8, y + 18);
    ctx.stroke();

    // Augen
    ctx.fillStyle = "#111";

    ctx.beginPath();
    ctx.arc(x - 10, y - 5, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(x + 10, y - 5, 4, 0, Math.PI * 2);
    ctx.fill();

    // Antennen
    ctx.strokeStyle = "#111";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(x - 10, y - 18);
    ctx.lineTo(x - 17, y - 30);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(x + 10, y - 18);
    ctx.lineTo(x + 17, y - 30);
    ctx.stroke();
}


// ==============================
// UPDATE
// ==============================

function update() {

    // Sanfte Spurbewegung
    player.x +=
        (player.targetX - player.x) * 0.25;


    // Springen
    if (player.jumping) {

        player.y += player.jumpVelocity;

        player.jumpVelocity += player.gravity;

        const groundY = height - 150;

        if (player.y >= groundY) {

            player.y = groundY;

            player.jumping = false;
            player.jumpVelocity = 0;
        }
    }


    // Geschwindigkeit langsam erhöhen
    speed += 0.0005;
}


// ==============================
// DRAW
// ==============================

function draw() {

    ctx.clearRect(0, 0, width, height);

    drawBackground();
    drawLanes();

    drawBee();
}


// ==============================
// GAME LOOP
// ==============================

function gameLoop() {

    update();
    draw();

    requestAnimationFrame(gameLoop);
}

gameLoop();

</script>

</body>
</html>
